# Tests, checks (bmx check) and builds the extensions a push or pull request
# changed (scripts/changed.sh). On a push to master, an extension whose
# version is not released yet is published as GitHub releases
# (scripts/publish.sh), from which BMEditor installs it without building. A
# pull request is only tested and built; a manual run covers every
# extension.
name: Publish

on:
  push:
    branches: [master]
    paths:
      - 'bmeditor-*/**'
      - 'bmext/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'bmeditor-*/**'
      - 'bmext/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find
        run: sh scripts/changed.sh "$BASE" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  publish:
    needs: changes
    if: needs.changes.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: bmeditor-web/go.mod
          cache: false

      - name: Test
        if: hashFiles(format('{0}/go.mod', matrix.dir)) != ''
        working-directory: ${{ matrix.dir }}
        run: go test ./...

      - name: Install bmx
        run: |
          go -C bmext build -o "$RUNNER_TEMP/bin/bmx" ./cmd/bmx
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # As BMEditor installs it from a repository of its own, and with a
      # copy of the SDK that is up to date.
      - name: Check
        working-directory: ${{ matrix.dir }}
        run: bmx check

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: bmx pack

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: sh scripts/publish.sh ${{ matrix.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
